<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow • Modern Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-label="Task manager app">
    <header class="app-header">
      <p class="badge">Productivity</p>
      <h1>TaskFlow</h1>
      <p class="subtitle">Plan your day with a cleaner, modern task board.</p>
    </header>

    <form id="task-form" class="task-form">
      <input id="task-input" type="text" placeholder="What do you need to do?" required />
      <button type="submit">Add Task</button>
    </form>

    <section class="controls">
      <div class="filter-wrap">
        <label for="filter">View</label>
        <select id="filter">
          <option value="all">All</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <button id="clear-completed" class="ghost" type="button">Clear Completed</button>
    </section>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <footer class="app-footer">
      <p id="task-count" class="task-count"></p>
    </footer>
  </main>

  <script src="soe.js"></script>
</body>
</html>
